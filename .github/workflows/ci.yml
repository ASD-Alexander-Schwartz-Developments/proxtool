# Tests on every push and pull request (no radio needed).
name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.13" }
          - { os: ubuntu-22.04, python: "3.9" }     # newer Ubuntu images no longer offer 3.9
          - { os: ubuntu-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[ncp]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
